# MDV6-yolov10-c.tflite — MegaDetector v6 (YOLOv10-compact), TFLite/LiteRT build.
#
# fp16 TensorFlow Lite build of `MDV6-yolov10-c` for the sparrow-engine mobile
# flavor (spe-mobile / sparrow-engine-mobile, LiteRT backend) on ARM edge devices.
# Same letterbox + yolo_e2e contract as the ONNX detector, but NHWC-input (the
# TensorFlow channels-last convention onnx2tf emits). See `MDV6-yolov10-c` for the
# reference ONNX + full provenance. Converted via
# scripts/onboard-model/convert_onnx_to_tflite.py (RP-42).

