name: Verify Task 9 validation feedback bridge API RED

on:
  push:
    branches:
      - feat/dinov3-multiprototype-remaining
    paths:
      - .github/workflows/task9-focused-validation-feedback-api-red.yml

jobs:
  flutter-validation-feedback-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dinov3-multiprototype-remaining
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - working-directory: frontend
        run: flutter pub get
      - working-directory: frontend
        run: flutter test test/dinov3_feedback_api_test.dart --plain-name "single validation forwards DINO model and operation ids"
