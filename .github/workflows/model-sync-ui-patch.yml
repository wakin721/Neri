name: One-shot model sync UI patch

on:
  push:
    branches:
      - codex/model-sync
    paths:
      - .github/workflows/model-sync-ui-patch.yml
      - scripts/apply_model_sync_ui_patch.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: codex/model-sync
          fetch-depth: 0

      - name: Apply anchored UI patch
        run: python scripts/apply_model_sync_ui_patch.py

      - name: Commit patched UI
        run: |
          if git diff --quiet; then
            echo "No patch changes produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/lib/src/screens/start_screen.dart frontend/lib/src/screens/settings_screen.dart frontend/lib/src/main_window.dart
          git commit -m "feat: integrate model sync UI"
          git push origin HEAD:codex/model-sync
