name: Apply Task 9 validation operation RED

on:
  push:
    branches:
      - feat/dinov3-multiprototype-remaining
    paths:
      - .github/workflows/task9-apply-validation-operation-red.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dinov3-multiprototype-remaining
      - name: Patch validation operation test
        run: python .github/scripts/task9_validation_operation_red.py
      - name: Commit validation operation RED
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/test/dinov3_box_feedback_ui_test.dart
          git diff --cached --quiet && exit 0
          git commit -m "test: define file validation feedback operation id"
          git push
