name: Verify Task 9 feedback merge RED

# traced bounded-pumps rerun with process timeout
on:
  push:
    branches:
      - feat/dinov3-multiprototype-remaining
    paths:
      - .github/workflows/task9-focused-feedback-merge-red.yml

jobs:
  flutter-feedback-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dinov3-multiprototype-remaining
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - working-directory: frontend
        run: flutter pub get
      - working-directory: frontend
        run: timeout 45s flutter test test/dinov3_feedback_merge_test.dart --reporter expanded --timeout 60s
