name: Alpha3 Lowercase Path Patch

on:
  push:
    branches:
      - codex/model-sync

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: codex/model-sync
          fetch-depth: 0

      - name: Apply exact alpha3 patch
        run: python scripts/alpha3_lowercase_patch.py

      - name: Commit patch if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/superpowers/specs/2026-09-07-model-sync-design.md docs/superpowers/plans/2026-09-07-model-sync.md frontend/lib/src/screens/start_screen.dart frontend/lib/src/screens/settings_screen.dart frontend/test/model_selection_test.dart
          git commit -m "chore: align alpha3 local model paths"
          git push origin HEAD:codex/model-sync
