name: DINOv2 implementation verification

on:
  push:
    branches:
      - nightly
      - feature/dinov2-clean-break
    paths-ignore:
      - docs/dinov2-ci-verified.txt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dinov2-implementation-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify DINOv2 integration files
        shell: bash
        run: |
          set -euo pipefail
          test -d system/dinov2
          test -f system/dinov2/checkpoint.py
          test -f system/dinov2/encoder.py
          test -f system/dinov2/classifier.py
          test -f system/dinov2/runtime.py
          test -f system/dinov2/registry.py
          test -f system/dinov2/feedback.py
          test -f system/dinov2/component.py
          test -f system/dinov2/api.py
          grep -F 'APIRouter(prefix="/api/dinov2"' system/dinov2/api.py
          grep -F 'local_files_only=True' system/dinov2/encoder.py
          grep -F 'trust_remote_code=False' system/dinov2/encoder.py
          find tests -maxdepth 1 -type f -name 'test_dinov2*.py' | grep .

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest httpx numpy transformers safetensors
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Compile Python sources
        run: python -m compileall -q system tests

      - name: Run DINOv2 tests
        shell: bash
        run: |
          mapfile -t tests < <(find tests -maxdepth 1 -type f -name 'test_dinov2*.py' -print | sort)
          python -m pytest -q "${tests[@]}"

      - name: Run full Python test suite
        run: python -m pytest -q

  flutter:
    name: Flutter analysis and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Analyze
        working-directory: frontend
        run: flutter analyze

      - name: Test
        working-directory: frontend
        run: flutter test

  mark-verified:
    name: Record verified revision
    if: github.ref == 'refs/heads/nightly'
    needs:
      - python
      - flutter
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: nightly

      - name: Write verification marker
        shell: bash
        env:
          VERIFIED_SHA: ${{ github.sha }}
          VERIFIED_RUN_ID: ${{ github.run_id }}
        run: |
          cat > docs/dinov2-ci-verified.txt <<EOF
          DINOv2 implementation verification passed.
          Source commit: ${VERIFIED_SHA}
          Workflow run: ${VERIFIED_RUN_ID}
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/dinov2-ci-verified.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: record DINOv2 nightly verification"
          git push origin HEAD:nightly
