name: Temporary DINOv3 equal-scale final verification

on:
  push:
    branches:
      - feat/dinov3-startup-registry-ui

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: frontend
        run: flutter pub get
      - name: Analyze frontend
        working-directory: frontend
        run: flutter analyze
      - name: Run full Flutter tests
        working-directory: frontend
        run: flutter test
