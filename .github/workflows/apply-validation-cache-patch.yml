name: Apply validation cache integration patch

on:
  push:
    paths:
      - ".github/workflows/apply-validation-cache-patch.yml"
      - "tools/apply_validation_cache_patch.py"

permissions:
  contents: write

jobs:
  patch-validation-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: fix/validation-rejection-preview-cache
          fetch-depth: 0

      - name: Apply incremental-cache patch
        run: python tools/apply_validation_cache_patch.py

      - name: Verify structural wiring
        run: python tests/test_validation_cache_wiring.py

      - name: Check patch cleanliness
        run: git diff --check

      - name: Commit validation cache integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/lib/src/screens/species_validation_screen.dart
          git commit -m "perf: update validation grouping cache incrementally"
          git push origin HEAD:fix/validation-rejection-preview-cache
