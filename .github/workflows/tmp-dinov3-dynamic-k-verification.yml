name: Temporary DINOv3 dynamic K verification

on:
  push:
    branches:
      - fix/dinov3-dynamic-selection-k-runtime-deps

permissions:
  contents: read

jobs:
  python:
    name: Python integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest httpx numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile Python sources
        run: python -m compileall -q system tests
      - name: Run targeted regression tests
        run: |
          python -m pytest -q \
            tests/test_dinov3_multi_prototype_checkpoint.py \
            tests/test_dinov3_dynamic_component_contract.py \
            tests/test_dinov3_lazy_import.py
      - name: Run all DINOv3 tests
        shell: bash
        run: |
          mapfile -t tests < <(find tests -maxdepth 1 -type f -name 'test_*dinov3*.py' -print | sort)
          python -m pytest -q "${tests[@]}"
      - name: Run full Python suite
        run: python -m pytest -q

  flutter:
    name: Flutter analysis and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: frontend
        run: flutter pub get
      - name: Analyze
        working-directory: frontend
        run: flutter analyze
      - name: Test
        working-directory: frontend
        run: flutter test
