name: Temporary DINOv3 dynamic K verification

on:
  push:
    branches:
      - fix/dinov3-dynamic-selection-k-runtime-deps
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest httpx numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run targeted regression tests
        run: |
          python -m pytest -q \
            tests/test_dinov3_multi_prototype_checkpoint.py \
            tests/test_dinov3_dynamic_component_contract.py \
            tests/test_dinov3_lazy_import.py
