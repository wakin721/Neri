name: Validation performance verification

on:
  push:
    paths:
      - ".github/workflows/validation-performance.yml"

permissions:
  contents: write

jobs:
  format-validation-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: fix/validation-rejection-preview-cache
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: true

      - name: Format validation cache files
        working-directory: frontend
        run: dart format lib/src/screens/species_validation_screen.dart lib/src/utils/validation_cache_delta.dart test/species_validation_incremental_cache_test.dart

      - name: Verify structural wiring
        run: python tests/test_validation_cache_wiring.py

      - name: Check diff cleanliness
        run: git diff --check

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/lib/src/screens/species_validation_screen.dart frontend/lib/src/utils/validation_cache_delta.dart frontend/test/species_validation_incremental_cache_test.dart
          git commit -m "style: format validation cache changes"
          git push origin HEAD:fix/validation-rejection-preview-cache
