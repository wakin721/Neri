name: Validation performance verification

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/validation-performance.yml"
      - "frontend/lib/src/screens/species_validation_screen.dart"
      - "frontend/lib/src/utils/validation_cache_delta.dart"
      - "frontend/test/species_validation_incremental_cache_test.dart"
      - "frontend/test/species_validation_group_expansion_test.dart"
      - "frontend/test/dinov3_validation_selected_box_learning_test.dart"
      - "tests/test_validation_cache_wiring.py"
  pull_request:
    paths:
      - ".github/workflows/validation-performance.yml"
      - "frontend/lib/src/screens/species_validation_screen.dart"
      - "frontend/lib/src/utils/validation_cache_delta.dart"
      - "frontend/test/species_validation_incremental_cache_test.dart"
      - "frontend/test/species_validation_group_expansion_test.dart"
      - "frontend/test/dinov3_validation_selected_box_learning_test.dart"
      - "tests/test_validation_cache_wiring.py"

permissions:
  contents: read

concurrency:
  group: validation-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Verify incremental cache wiring
        run: python tests/test_validation_cache_wiring.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Check Dart formatting
        working-directory: frontend
        run: dart format --output=none --set-exit-if-changed lib/src/screens/species_validation_screen.dart lib/src/utils/validation_cache_delta.dart test/species_validation_incremental_cache_test.dart

      - name: Run focused validation tests
        working-directory: frontend
        run: flutter test --reporter expanded test/species_validation_incremental_cache_test.dart test/species_validation_group_expansion_test.dart test/dinov3_validation_selected_box_learning_test.dart
