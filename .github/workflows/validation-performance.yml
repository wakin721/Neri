name: Validation performance verification

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/validation-performance.yml"
      - "frontend/lib/src/screens/species_validation_screen.dart"
      - "frontend/lib/src/utils/validation_cache_delta.dart"
      - "frontend/test/species_validation_incremental_cache_test.dart"
      - "frontend/test/species_validation_group_expansion_test.dart"
      - "frontend/test/dinov3_validation_selected_box_learning_test.dart"
      - "tests/test_validation_cache_wiring.py"
  pull_request:
    paths:
      - ".github/workflows/validation-performance.yml"
      - "frontend/lib/src/screens/species_validation_screen.dart"
      - "frontend/lib/src/utils/validation_cache_delta.dart"
      - "frontend/test/species_validation_incremental_cache_test.dart"
      - "frontend/test/species_validation_group_expansion_test.dart"
      - "frontend/test/dinov3_validation_selected_box_learning_test.dart"
      - "tests/test_validation_cache_wiring.py"

permissions:
  contents: read

concurrency:
  group: validation-performance-wiring-red-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation-wiring:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Verify incremental cache wiring
        run: python tests/test_validation_cache_wiring.py
