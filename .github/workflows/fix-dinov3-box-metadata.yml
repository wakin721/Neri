name: Apply DINOv3 box metadata fix

on:
  push:
    branches:
      - feat/dinov3-multiprototype-remaining

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dinov3-multiprototype-remaining
          fetch-depth: 0

      - name: Preserve DINOv3 box identity metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('system/backend/services.py')
          text = path.read_text(encoding='utf-8')
          anchor = '        if frame_index is not None:\n'
          insert = (
              '        candidate_metadata = None\n'
              '        if isinstance(candidates, list):\n'
              '            for candidate in candidates:\n'
              '                if isinstance(candidate, dict) and candidate.get("observation_id"):\n'
              '                    candidate_metadata = candidate\n'
              '                    break\n'
              '        metadata_source = candidate_metadata or raw_box\n'
              '        observation_id = _value_from_keys(metadata_source, ("observation_id",))\n'
              '        registry_id = _coerce_int(_value_from_keys(metadata_source, ("registry_id",)))\n'
              '        predicted_species = _value_from_keys(metadata_source, ("predicted_species",))\n'
              '        if observation_id is not None:\n'
              '            box_data["observation_id"] = str(observation_id)\n'
              '        if registry_id is not None:\n'
              '            box_data["registry_id"] = registry_id\n'
              '        if predicted_species is not None:\n'
              '            box_data["predicted_species"] = str(predicted_species)\n'
          )
          if 'box_data["observation_id"]' in text:
              raise SystemExit('metadata fix already present')
          if anchor not in text:
              raise SystemExit('target anchor not found')
          path.write_text(text.replace(anchor, insert + anchor, 1), encoding='utf-8')
          PY

      - name: Commit fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add system/backend/services.py
          git commit -m "fix: preserve DINOv3 box observation metadata"
          git push origin HEAD:feat/dinov3-multiprototype-remaining
