name: Temporary DINOv3 clear candidates TDD

on:
  push:
    branches:
      - feat/dinov3-startup-registry-ui

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q numpy pytest fastapi pydantic opencv-python-headless
      - run: python -m pytest -q tests/test_dinov3_registry_clear_candidates.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: frontend
        run: flutter pub get
      - name: Run clear-candidates UI regression
        working-directory: frontend
        run: flutter test test/dinov3_registry_clear_candidates_test.dart
