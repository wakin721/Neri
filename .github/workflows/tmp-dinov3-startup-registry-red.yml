name: Temporary DINOv3 startup registry GREEN

on:
  push:
    branches:
      - feat/dinov3-startup-registry-ui

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Apply implementation
        run: python tools/apply_dinov3_startup_registry_ui.py

      - name: Apply compatibility and responsive fixes
        shell: python
        run: |
          from pathlib import Path

          feedback = Path('frontend/lib/src/screens/species_validation_screen.dart')
          source = feedback.read_text(encoding='utf-8')
          old = """            Expanded(
                        child: Text(
                          title,
                          maxLines: 1,
                          overflow: TextOverflow.ellipsis,
                          style: const TextStyle(fontWeight: FontWeight.w600),
                        ),
                      ),
          """
          new = """            Expanded(
                        child: DefaultTextStyle.merge(
                          style: const TextStyle(fontWeight: FontWeight.w600),
                          child: Row(
                            children: [
                              Flexible(
                                child: Text(
                                  title.substring(
                                    0,
                                    title.length - '检测框校验'.length,
                                  ),
                                  maxLines: 1,
                                  overflow: TextOverflow.ellipsis,
                                ),
                              ),
                              const Text('检测框校验'),
                            ],
                          ),
                        ),
                      ),
          """
          assert source.count(old) == 1, source.count(old)
          feedback.write_text(source.replace(old, new, 1), encoding='utf-8')

          dialog = Path('frontend/lib/src/widgets/dinov3_registry_dialog.dart')
          source = dialog.read_text(encoding='utf-8')
          old = """        Row(
                    mainAxisAlignment: MainAxisAlignment.end,
                    children: [
          """
          new = """        Wrap(
                    alignment: WrapAlignment.end,
                    spacing: 8,
                    runSpacing: 8,
                    children: [
          """
          assert source.count(old) == 1, source.count(old)
          dialog.write_text(source.replace(old, new, 1), encoding='utf-8')

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest httpx numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run DINOv3 Python tests
        shell: bash
        run: |
          set -o pipefail
          mapfile -t tests < <(find tests -maxdepth 1 -type f -name 'test_*dinov3*.py' -print | sort)
          python -m pytest -q "${tests[@]}" 2>&1 | tee /tmp/dinov3-python.log

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Format changed Dart sources
        run: |
          dart format \
            frontend/lib/main.dart \
            frontend/lib/src/dinov3_startup_check.dart \
            frontend/lib/src/main_window.dart \
            frontend/lib/src/api_client_core.dart \
            frontend/lib/src/models/dinov3_registry.dart \
            frontend/lib/src/widgets/dinov3_registry_dialog.dart \
            frontend/lib/src/screens/species_validation_screen.dart \
            frontend/test/dinov3_startup_registry_features_test.dart

      - name: Run focused Flutter test
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          flutter test test/dinov3_startup_registry_features_test.dart 2>&1 | tee /tmp/dinov3-flutter-focused.log

      - name: Analyze Flutter sources
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee /tmp/dinov3-flutter-analyze.log

      - name: Run full Flutter tests
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          flutter test 2>&1 | tee /tmp/dinov3-flutter-full.log

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dinov3-startup-registry-failure-logs
          path: /tmp/dinov3-*.log
          if-no-files-found: ignore

      - name: Commit verified implementation and remove temporary CI
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/apply_dinov3_startup_registry_ui.py
          rm -f .github/workflows/tmp-dinov3-startup-registry-red.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "feat: add DINOv3 startup and registry management UI"
          git push origin HEAD:feat/dinov3-startup-registry-ui
