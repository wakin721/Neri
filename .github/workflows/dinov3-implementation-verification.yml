name: DINOv3 implementation verification

on:
  push:
    branches:
      - nightly
      - feat/dinov3-multiprototype-remaining
    paths-ignore:
      - docs/dinov3-ci-verified.txt
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dinov3-implementation-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify required integration files
        shell: bash
        run: |
          set -euo pipefail
          test -d system/dinov3
          test -f system/dinov3/__init__.py
          find system/dinov3 -maxdepth 1 -type f | grep -E '/[^/]*(classif|runtime|inference)[^/]*\.py$'
          find system/dinov3 -maxdepth 1 -type f | grep -E '/[^/]*(registr|store)[^/]*\.py$'
          find tests -maxdepth 1 -type f -name 'test_*dinov3*.py' | grep .
          grep -F 'APIRouter(prefix="/api/dinov3"' system/dinov3/api.py
          grep -F '@router.get("/registry"' system/dinov3/api.py
          grep -F '@router.get("/registry/{registration_id}"' system/dinov3/api.py
          grep -F '"/registry/{registration_id}/events"' system/dinov3/api.py
          grep -F '@router.patch("/registry/{registration_id}/identity"' system/dinov3/api.py
          grep -F '@router.post("/registry/{registration_id}/register"' system/dinov3/api.py
          grep -R 'EVENT_GAP_SECONDS' system/dinov3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest httpx numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Compile Python sources
        run: python -m compileall -q system tests

      - name: Run DINOv3 tests
        shell: bash
        run: |
          mapfile -t tests < <(find tests -maxdepth 1 -type f -name 'test_*dinov3*.py' -print | sort)
          python -m pytest -q "${tests[@]}"

      - name: Run full Python test suite
        run: python -m pytest -q

  flutter:
    name: Flutter analysis and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Analyze
        working-directory: frontend
        run: flutter analyze

      - name: Test
        working-directory: frontend
        run: flutter test

  mark-verified:
    name: Record verified revision
    if: github.ref == 'refs/heads/nightly'
    needs:
      - python
      - flutter
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: nightly

      - name: Write verification marker
        shell: bash
        env:
          VERIFIED_SHA: ${{ github.sha }}
          VERIFIED_RUN_ID: ${{ github.run_id }}
        run: |
          cat > docs/dinov3-ci-verified.txt <<EOF
          DINOv3 implementation verification passed.
          Source commit: ${VERIFIED_SHA}
          Workflow run: ${VERIFIED_RUN_ID}
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/dinov3-ci-verified.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: record nightly verification"
          git push origin HEAD:nightly
