name: Apply Task 9 feedback strip patch

on:
  push:
    branches:
      - feat/dinov3-multiprototype-remaining
    paths:
      - .github/workflows/task9-apply-feedback-strip.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch feedback strip
        run: python .github/scripts/task9_feedback_strip.py
      - name: Commit feedback strip
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/lib/src/screens/species_validation_screen.dart
          git diff --cached --check
          git commit -m "feat: show DINOv3 box feedback controls"
          git push origin HEAD:${GITHUB_REF_NAME}
