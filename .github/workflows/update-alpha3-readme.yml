name: Update alpha3 release notes

on:
  push:
    branches:
      - codex/model-sync

permissions:
  contents: write

jobs:
  update-release-notes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: codex/model-sync

      - name: Prepend alpha3 release notes
        shell: bash
        env:
          RELEASE_NOTES_B64: 
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          import os

          path = Path('res/demo/README_Update.md')
          text = path.read_text(encoding='utf-8')
          prefix = base64.b64decode(os.environ['RELEASE_NOTES_B64']).decode('utf-8')
          marker = '## ✨ Neri 3.0.6-alpha3 更新日志 (2026.09.07)'
          header = '# 📜 Neri 更新日志\n\n---\n\n'
          if marker not in text:
              text = prefix + (text[len(header):] if text.startswith(header) else text)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-shot files
        shell: bash
        run: |
          rm -f .github/workflows/update-alpha3-readme.yml
          rm -f .github/update-alpha3-trigger

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add res/demo/README_Update.md .github/workflows/update-alpha3-readme.yml .github/update-alpha3-trigger
          git diff --cached --quiet && exit 0
          git commit -m "docs: add alpha3 release notes"
          git push origin HEAD:codex/model-sync
