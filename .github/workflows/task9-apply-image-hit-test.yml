name: Apply Task 9 image box hit-test patch

on:
  push:
    branches:
      - feat/dinov3-multiprototype-remaining
    paths:
      - .github/workflows/task9-apply-image-hit-test.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch image box hit testing
        run: python .github/scripts/task9_image_hit_test.py
      - name: Commit image box hit testing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/lib/src/widgets/detection_media_viewer.dart
          git diff --cached --check
          git commit -m "feat: add DINOv3 image box selection"
          git push origin HEAD:${GITHUB_REF_NAME}
