name: Apply Task 9 image box hit-test patch

on:
  push:
    branches:
      - feat/dinov3-multiprototype-remaining
    paths:
      - .github/workflows/task9-apply-image-hit-test.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch image box hit testing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/lib/src/widgets/detection_media_viewer.dart')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "    this.isFavorite = false,\n    this.onToggleFavorite,\n    super.key,\n",
                  "    this.isFavorite = false,\n    this.onToggleFavorite,\n    this.selectedObservationId,\n    this.onDetectionBoxSelected,\n    super.key,\n",
              ),
              (
                  "  final bool isFavorite;\n  final VoidCallback? onToggleFavorite;\n",
                  "  final bool isFavorite;\n  final VoidCallback? onToggleFavorite;\n  final String? selectedObservationId;\n  final ValueChanged<DetectionBox?>? onDetectionBoxSelected;\n",
              ),
              (
                  "                showDetections: showDetections,\n                onOpenExternal: onOpenExternal,\n              ),\n",
                  "                showDetections: showDetections,\n                onOpenExternal: onOpenExternal,\n                selectedObservationId: selectedObservationId,\n                onDetectionBoxSelected: onDetectionBoxSelected,\n              ),\n",
              ),
              (
                  "    required this.showDetections,\n    required this.onOpenExternal,\n  });\n\n  final DetectionItem item;\n  final List<DetectionBox> visibleBoxes;\n  final bool showDetections;\n  final VoidCallback onOpenExternal;\n",
                  "    required this.showDetections,\n    required this.onOpenExternal,\n    this.selectedObservationId,\n    this.onDetectionBoxSelected,\n  });\n\n  final DetectionItem item;\n  final List<DetectionBox> visibleBoxes;\n  final bool showDetections;\n  final VoidCallback onOpenExternal;\n  final String? selectedObservationId;\n  final ValueChanged<DetectionBox?>? onDetectionBoxSelected;\n",
              ),
              (
                  "        visibleBoxes: visibleBoxes,\n        showDetections: showDetections,\n      );\n",
                  "        visibleBoxes: visibleBoxes,\n        showDetections: showDetections,\n        selectedObservationId: selectedObservationId,\n        onDetectionBoxSelected: onDetectionBoxSelected,\n      );\n",
              ),
              (
                  "    required this.visibleBoxes,\n    required this.showDetections,\n  });\n\n  final String path;\n  final List<DetectionBox> visibleBoxes;\n  final bool showDetections;\n",
                  "    required this.visibleBoxes,\n    required this.showDetections,\n    this.selectedObservationId,\n    this.onDetectionBoxSelected,\n  });\n\n  final String path;\n  final List<DetectionBox> visibleBoxes;\n  final bool showDetections;\n  final String? selectedObservationId;\n  final ValueChanged<DetectionBox?>? onDetectionBoxSelected;\n",
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'anchor not found: {old!r}')
              text = text.replace(old, new, 1)

          old_build = """    return Stack(
      fit: StackFit.expand,
      children: [
        Image.file(
          File(widget.path),
          key: ValueKey(widget.path),
          fit: BoxFit.contain,
          errorBuilder: (context, error, stackTrace) =>
              _MissingImagePlaceholder(path: widget.path),
        ),
        if (widget.showDetections && _imageSize != null)
          CustomPaint(
            painter: _DetectionOverlayPainter(
              boxes: widget.visibleBoxes,
              mediaSize: _imageSize!,
            ),
          ),
      ],
    );
"""
          new_build = """    return LayoutBuilder(
      builder: (context, constraints) {
        final viewport = Size(constraints.maxWidth, constraints.maxHeight);
        return GestureDetector(
          behavior: HitTestBehavior.translucent,
          onTapUp: widget.onDetectionBoxSelected == null || _imageSize == null
              ? null
              : (details) {
                  final selected = widget.showDetections
                      ? _hitTestDinoBox(
                          details.localPosition,
                          viewport,
                          _imageSize!,
                          widget.visibleBoxes,
                        )
                      : null;
                  widget.onDetectionBoxSelected!(selected);
                },
          child: Stack(
            fit: StackFit.expand,
            children: [
              Image.file(
                File(widget.path),
                key: ValueKey(widget.path),
                fit: BoxFit.contain,
                errorBuilder: (context, error, stackTrace) =>
                    _MissingImagePlaceholder(path: widget.path),
              ),
              if (widget.showDetections && _imageSize != null)
                CustomPaint(
                  painter: _DetectionOverlayPainter(
                    boxes: widget.visibleBoxes,
                    mediaSize: _imageSize!,
                  ),
                ),
            ],
          ),
        );
      },
    );
"""
          if old_build not in text:
              raise SystemExit('image build anchor not found')
          text = text.replace(old_build, new_build, 1)

          helper_anchor = "class _TimedBoxMatch {\n"
          helpers = """Rect _fittedMediaRect(Size viewport, Size media) {
  if (viewport.isEmpty || media.isEmpty) return Rect.zero;
  final scale = math.min(
    viewport.width / media.width,
    viewport.height / media.height,
  );
  final fittedSize = Size(media.width * scale, media.height * scale);
  return Rect.fromLTWH(
    (viewport.width - fittedSize.width) / 2,
    (viewport.height - fittedSize.height) / 2,
    fittedSize.width,
    fittedSize.height,
  );
}

Rect? _renderRectForBox(
  DetectionBox box,
  Size viewport,
  Size mediaSize,
) {
  if (box.bbox.length < 4 || viewport.isEmpty || mediaSize.isEmpty) {
    return null;
  }
  final fitted = _fittedMediaRect(viewport, mediaSize);
  if (fitted.isEmpty) return null;

  final xmin = box.bbox[0];
  final ymin = box.bbox[1];
  final xmax = box.bbox[2];
  final ymax = box.bbox[3];
  final isNormalized = xmax <= 1.5 && ymax <= 1.5;
  final scaleX = fitted.width / mediaSize.width;
  final scaleY = fitted.height / mediaSize.height;

  return Rect.fromLTRB(
    fitted.left + (isNormalized ? xmin * fitted.width : xmin * scaleX),
    fitted.top + (isNormalized ? ymin * fitted.height : ymin * scaleY),
    fitted.left + (isNormalized ? xmax * fitted.width : xmax * scaleX),
    fitted.top + (isNormalized ? ymax * fitted.height : ymax * scaleY),
  );
}

DetectionBox? _hitTestDinoBox(
  Offset localPosition,
  Size viewport,
  Size mediaSize,
  List<DetectionBox> boxes,
) {
  for (final box in boxes.reversed) {
    final observationId = box.observationId?.trim();
    if (observationId == null || observationId.isEmpty) continue;
    final rect = _renderRectForBox(box, viewport, mediaSize);
    if (rect != null && rect.contains(localPosition)) return box;
  }
  return null;
}

"""
          if helper_anchor not in text:
              raise SystemExit('helper anchor not found')
          text = text.replace(helper_anchor, helpers + helper_anchor, 1)

          old_geometry = """    final mediaRatio = mediaSize.width / mediaSize.height;
    final canvasRatio = size.width / size.height;
    double w, h, dx, dy;

    if (mediaRatio > canvasRatio) {
      w = size.width;
      h = w / mediaRatio;
      dx = 0;
      dy = (size.height - h) / 2;
    } else {
      h = size.height;
      w = h * mediaRatio;
      dx = (size.width - w) / 2;
      dy = 0;
    }

    final scaleX = w / mediaSize.width;
    final scaleY = h / mediaSize.height;

"""
          if old_geometry not in text:
              raise SystemExit('painter geometry anchor not found')
          text = text.replace(old_geometry, "", 1)

          old_rect = """      final xmin = box.bbox[0];
      final ymin = box.bbox[1];
      final xmax = box.bbox[2];
      final ymax = box.bbox[3];

      final isNormalized = xmax <= 1.5 && ymax <= 1.5;

      double renderXMin, renderYMin, renderXMax, renderYMax;
      if (isNormalized) {
        renderXMin = dx + xmin * w;
        renderYMin = dy + ymin * h;
        renderXMax = dx + xmax * w;
        renderYMax = dy + ymax * h;
      } else {
        renderXMin = dx + xmin * scaleX;
        renderYMin = dy + ymin * scaleY;
        renderXMax = dx + xmax * scaleX;
        renderYMax = dy + ymax * scaleY;
      }

      final rect = Rect.fromLTRB(
        renderXMin,
        renderYMin,
        renderXMax,
        renderYMax,
      );
"""
          new_rect = """      final rect = _renderRectForBox(box, size, mediaSize);
      if (rect == null) continue;
      final fitted = _fittedMediaRect(size, mediaSize);
"""
          if old_rect not in text:
              raise SystemExit('painter rect anchor not found')
          text = text.replace(old_rect, new_rect, 1)
          text = text.replace(
              "      final textY = math.max(dy, rect.top - textPainter.height - 2);\n",
              "      final textY = math.max(\n        fitted.top,\n        rect.top - textPainter.height - 2,\n      );\n",
              1,
          )

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit image box hit testing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/lib/src/widgets/detection_media_viewer.dart
          git diff --cached --check
          git commit -m "feat: add DINOv3 image box selection"
          git push origin HEAD:${GITHUB_REF_NAME}
