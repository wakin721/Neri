name: Patch DINOv2 registry UI

on:
  push:
    branches:
      - feature/dinov2-clean-break

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dinov2-clean-break

      - name: Patch registry condition copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/lib/src/widgets/dinov2_registry_dialog.dart')
          text = path.read_text(encoding='utf-8')

          old_events = "_conditionRow('≥5 个独立事件', conditions['events'] == true),"
          new_events = "_conditionRow('≥4 个独立事件', conditions['events'] == true),"
          old_cameras = "_conditionRow('≥2 台相机', conditions['cameras'] == true),"

          if text.count(old_events) != 1:
              raise SystemExit(f'expected exactly one events condition, found {text.count(old_events)}')
          if text.count(old_cameras) != 1:
              raise SystemExit(f'expected exactly one cameras condition, found {text.count(old_cameras)}')

          text = text.replace(old_events, new_events)
          text = text.replace(old_cameras + '\n', '')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-shot workflow and commit fix
        shell: bash
        run: |
          rm .github/workflows/patch-dinov2-registry-ui.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/lib/src/widgets/dinov2_registry_dialog.dart .github/workflows/patch-dinov2-registry-ui.yml
          git commit -m "fix: align DINOv2 registry conditions with backend"
          git push origin HEAD:feature/dinov2-clean-break
