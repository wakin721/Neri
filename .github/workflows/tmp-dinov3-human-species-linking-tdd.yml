name: Temporary DINOv3 human species linking final verification

on:
  push:
    branches:
      - feat/dinov3-startup-registry-ui

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Apply verified Registry linking patch
        run: python tools/patch_dinov3_registry_human_species_linking.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python test dependencies
        run: |
          python -m pip install -r requirements.txt pytest httpx numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Compile DINOv3 sources
        run: python -m compileall -q system tests/test_dinov3_registry_human_species_linking.py

      - name: Run all DINOv3 Python tests
        shell: bash
        run: |
          mapfile -t tests < <(find tests -maxdepth 1 -type f -name 'test_*dinov3*.py' -print | sort)
          python -m pytest -q "${tests[@]}"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Analyze Flutter frontend
        working-directory: frontend
        run: flutter analyze

      - name: Run full Flutter tests
        working-directory: frontend
        run: flutter test

      - name: Commit verified production change and clean temporary tooling
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add system/dinov3/registry.py tests/test_dinov3_registry_human_species_linking.py
          git rm -f --ignore-unmatch \
            .github/workflows/tmp-dinov3-human-species-linking-tdd.yml \
            tools/patch_dinov3_registry_human_species_linking.py
          git commit -m "fix: keep manual species corrections in one Registry entry"
          git push origin HEAD:feat/dinov3-startup-registry-ui
