name: Alpha3 Flutter Diagnostic

on:
  push:
    branches:
      - codex/model-sync

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Install Flutter 3.44.6
        shell: pwsh
        run: |
          git clone --branch 3.44.6 --depth 1 https://github.com/flutter/flutter.git C:\flutter
          "C:\flutter\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Get dependencies
        shell: pwsh
        working-directory: frontend
        run: C:\flutter\bin\flutter.bat pub get

      - name: Model sync tests
        timeout-minutes: 5
        shell: pwsh
        working-directory: frontend
        run: C:\flutter\bin\flutter.bat test test/model_sync_test.dart --reporter expanded

      - name: Model sync UI integration tests
        timeout-minutes: 5
        shell: pwsh
        working-directory: frontend
        run: C:\flutter\bin\flutter.bat test test/model_sync_ui_integration_test.dart --reporter expanded

      - name: Model selection tests
        timeout-minutes: 5
        shell: pwsh
        working-directory: frontend
        run: C:\flutter\bin\flutter.bat test test/model_selection_test.dart --reporter expanded
