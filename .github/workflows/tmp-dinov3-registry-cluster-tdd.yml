name: Temporary DINOv3 registry cluster TDD

on:
  push:
    branches:
      - feat/dinov3-startup-registry-ui
    paths:
      - 'frontend/test/dinov3_registry_cluster_view_test.dart'
      - '.github/workflows/tmp-dinov3-registry-cluster-tdd.yml'

permissions:
  contents: read

jobs:
  frontend-red:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        working-directory: frontend
        run: flutter pub get
      - name: Run frontend RED tests
        working-directory: frontend
        run: flutter test test/dinov3_registry_cluster_view_test.dart
