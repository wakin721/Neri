name: Temporary DINOv3 registry cluster TDD

on:
  push:
    branches:
      - feat/dinov3-startup-registry-ui
    paths:
      - 'tools/apply_dinov3_registry_cluster_backend.py'
      - '.github/workflows/tmp-dinov3-registry-cluster-tdd.yml'

permissions:
  contents: read

jobs:
  backend-green:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Apply backend implementation
        run: python tools/apply_dinov3_registry_cluster_backend.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt pytest numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile changed Python sources
        run: python -m compileall -q system tests/test_dinov3_registry_cluster_view.py
      - name: Run backend cluster tests
        run: python -m pytest -q tests/test_dinov3_registry_cluster_view.py tests/test_dinov3_registry_catalog_explain.py
