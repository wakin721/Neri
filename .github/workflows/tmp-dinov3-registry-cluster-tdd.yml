name: Temporary DINOv3 registry cluster final verification

on:
  push:
    branches:
      - feat/dinov3-startup-registry-ui
    paths:
      - '.github/workflows/tmp-dinov3-registry-cluster-tdd.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified backend implementation
        run: |
          python tools/apply_dinov3_registry_cluster_backend.py
          python tools/patch_dinov3_registry_cluster_backend_green.py
      - name: Apply verified frontend implementation
        run: python tools/apply_dinov3_registry_cluster_frontend.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Python test dependencies
        run: |
          python -m pip install -r requirements.txt pytest httpx numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile DINOv3 Python sources
        run: python -m compileall -q system tests/test_dinov3_registry_cluster_view.py
      - name: Run all DINOv3 Python tests
        shell: bash
        run: |
          mapfile -t tests < <(find tests -maxdepth 1 -type f -name 'test_*dinov3*.py' -print | sort)
          python -m pytest -q "${tests[@]}"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        working-directory: frontend
        run: flutter pub get
      - name: Format touched Dart files
        working-directory: frontend
        run: dart format lib/src/models/dinov3_registry.dart lib/src/widgets/dinov3_registry_dialog.dart lib/src/widgets/dinov3_feature_scatter.dart test/dinov3_registry_cluster_view_test.dart
      - name: Run focused DINOv3 Flutter tests
        working-directory: frontend
        run: flutter test test/dinov3_registry_cluster_view_test.dart test/dinov3_startup_registry_features_test.dart test/dinov3_feature_scatter_test.dart
      - name: Analyze Flutter frontend
        working-directory: frontend
        run: flutter analyze
      - name: Run full Flutter tests
        working-directory: frontend
        run: flutter test
      - name: Commit verified production changes and remove temporary tooling
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            system/backend/models.py \
            system/dinov3/api.py \
            system/dinov3/classifier.py \
            system/dinov3/feedback.py \
            system/dinov3/registry.py \
            frontend/lib/src/models/dinov3_registry.dart \
            frontend/lib/src/widgets/dinov3_registry_dialog.dart \
            frontend/lib/src/widgets/dinov3_feature_scatter.dart \
            tests/test_dinov3_registry_cluster_view.py \
            frontend/test/dinov3_registry_cluster_view_test.dart
          git rm -f --ignore-unmatch \
            .github/workflows/tmp-dinov3-registry-cluster-tdd.yml \
            tools/apply_dinov3_registry_cluster_backend.py \
            tools/patch_dinov3_registry_cluster_backend_green.py \
            tools/apply_dinov3_registry_cluster_frontend.py
          git commit -m "fix: expose DINOv3 learned clusters and refresh registry state"
          git push origin HEAD:feat/dinov3-startup-registry-ui
