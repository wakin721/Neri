name: Temporary DINOv3 registry cluster TDD

on:
  push:
    branches:
      - feat/dinov3-startup-registry-ui
    paths:
      - 'tools/apply_dinov3_registry_cluster_backend.py'
      - 'tools/patch_dinov3_registry_cluster_backend_green.py'
      - 'tools/apply_dinov3_registry_cluster_frontend.py'
      - 'tests/test_dinov3_registry_cluster_view.py'
      - 'frontend/test/dinov3_registry_cluster_view_test.dart'
      - '.github/workflows/tmp-dinov3-registry-cluster-tdd.yml'

permissions:
  contents: read

jobs:
  green:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Apply backend implementation
        run: |
          python tools/apply_dinov3_registry_cluster_backend.py
          python tools/patch_dinov3_registry_cluster_backend_green.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt pytest numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile changed Python sources
        run: python -m compileall -q system tests/test_dinov3_registry_cluster_view.py
      - name: Run backend cluster tests
        run: python -m pytest -q tests/test_dinov3_registry_cluster_view.py tests/test_dinov3_registry_catalog_explain.py
      - name: Apply frontend implementation
        run: python tools/apply_dinov3_registry_cluster_frontend.py
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        working-directory: frontend
        run: flutter pub get
      - name: Format changed Dart sources
        working-directory: frontend
        run: dart format lib/src/models/dinov3_registry.dart lib/src/widgets/dinov3_registry_dialog.dart lib/src/widgets/dinov3_feature_scatter.dart test/dinov3_registry_cluster_view_test.dart
      - name: Run registry cluster Flutter tests
        working-directory: frontend
        run: flutter test test/dinov3_registry_cluster_view_test.dart
      - name: Run existing DINOv3 frontend tests
        working-directory: frontend
        run: flutter test test/dinov3_startup_registry_features_test.dart test/dinov3_feature_scatter_test.dart
      - name: Analyze Flutter frontend
        working-directory: frontend
        run: flutter analyze
