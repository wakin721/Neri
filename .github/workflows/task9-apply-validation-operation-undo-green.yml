name: Apply Task 9 file operation undo GREEN

on:
  push:
    branches:
      - feat/dinov3-multiprototype-remaining
    paths:
      - .github/workflows/task9-apply-validation-operation-undo-green.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dinov3-multiprototype-remaining
      - name: Patch file operation undo history
        run: python .github/scripts/task9_validation_operation_undo_green.py
      - name: Commit file operation undo history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/lib/src/screens/species_validation_screen.dart
          git diff --cached --quiet && exit 0
          git commit -m "feat: store DINOv3 file validation operation ids"
          git push
