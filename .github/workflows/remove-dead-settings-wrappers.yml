name: One-shot settings wrapper cleanup

on:
  push:
    branches:
      - codex/model-sync
    paths:
      - .github/workflows/remove-dead-settings-wrappers.yml
      - scripts/remove_dead_settings_wrappers.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/model-sync
          fetch-depth: 0
      - name: Remove dead wrappers
        run: python scripts/remove_dead_settings_wrappers.py
      - name: Commit source cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/lib/src/screens/settings_screen.dart
          git commit -m "refactor: remove dead settings wrappers"
          git push origin HEAD:codex/model-sync
