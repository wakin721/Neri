name: Apply Task 9 feedback undo GREEN

on:
  push:
    branches:
      - feat/dinov3-multiprototype-remaining
    paths:
      - .github/workflows/task9-apply-feedback-undo-green.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dinov3-multiprototype-remaining
      - name: Patch feedback undo bridge
        run: python .github/scripts/task9_feedback_undo_green.py
      - name: Commit feedback undo GREEN
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/lib/src/screens/species_validation_screen.dart
          git diff --cached --quiet && exit 0
          git commit -m "feat: revert DINOv3 feedback from validation history"
          git push
