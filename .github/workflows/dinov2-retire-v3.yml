name: Retire DINOv3 after DINOv2 state migration

on:
  push:
    branches:
      - feature/dinov2-clean-break
    paths:
      - .github/workflows/dinov2-retire-v3.yml

permissions:
  contents: write

jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest httpx numpy transformers safetensors
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Migrate backbone-independent state tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import shutil

          selected = [
              'test_dinov3_api.py',
              'test_dinov3_events_simple_shot.py',
              'test_dinov3_feedback_index.py',
              'test_dinov3_feedback_learning.py',
              'test_dinov3_feedback_persistence.py',
              'test_dinov3_feedback_semantics.py',
              'test_dinov3_feedback_store.py',
              'test_dinov3_feedback_validation_bridge.py',
              'test_dinov3_persistence_fast.py',
              'test_dinov3_registry.py',
              'test_dinov3_registry_candidate_actions.py',
              'test_dinov3_registry_clear_candidates.py',
              'test_dinov3_registry_cluster_view.py',
              'test_dinov3_registry_concurrency.py',
              'test_dinov3_registry_examples.py',
              'test_dinov3_registry_human_species_linking.py',
              'test_dinov3_registry_management.py',
              'test_dinov3_registry_named_candidate_migration.py',
              'test_dinov3_registry_persistent_examples.py',
              'test_dinov3_registry_routing.py',
              'test_dinov3_registry_same_name_merge.py',
          ]
          replacements = (
              ('DinoV3', 'DinoV2'),
              ('dinoV3', 'dinoV2'),
              ('DINOv3', 'DINOv2'),
              ('dinov3', 'dinov2'),
          )
          tests = Path('tests')

          state_fixture = tests / 'dinov2_state_fixtures.py'
          state_fixture.write_text('''from __future__ import annotations

import torch

from system.dinov2.checkpoint import (
    DINO_BACKBONE,
    DINO_EVENT_AGGREGATION,
    DINO_FEATURE_DIM,
    DINO_PREPROCESSING,
    DINO_REJECTION_MODE,
    DinoV2Rejection,
)
from system.dinov2.feedback import HumanFeedbackStore as _HumanFeedbackStore

ENCODER_SHA256 = "0" * 64


def rejection_for_threshold(threshold: float) -> DinoV2Rejection:
    return DinoV2Rejection(
        mode=DINO_REJECTION_MODE,
        cosine_threshold=float(threshold),
        adjusted_distance_score_threshold=-1_000_000.0,
        margin_weight=0.0,
        class_distance_scales=None,
    )


class HumanFeedbackStore(_HumanFeedbackStore):
    """Test adapter preserving the old threshold= fixture ergonomics."""

    def __init__(
        self,
        path,
        *,
        model_fingerprint,
        checkpoint_classes,
        threshold=None,
        rejection=None,
        prototype_norm_power=0.0,
    ):
        if rejection is None:
            rejection = rejection_for_threshold(0.31 if threshold is None else threshold)
        super().__init__(
            path,
            model_fingerprint=model_fingerprint,
            checkpoint_classes=checkpoint_classes,
            rejection=rejection,
            prototype_norm_power=prototype_norm_power,
        )


def make_multi_prototype_payload(
    *,
    classes: tuple[str, ...] = ("A", "B"),
    threshold: float = 0.31,
    selection_k: int = 3,
) -> dict[str, object]:
    feature_center = torch.zeros(DINO_FEATURE_DIM, dtype=torch.float32)
    prototypes: list[torch.Tensor] = []
    prototype_class_indices: list[int] = []
    for class_index in range(len(classes)):
        for prototype_index in range(selection_k):
            vector = torch.zeros(DINO_FEATURE_DIM, dtype=torch.float32)
            vector[class_index * selection_k + prototype_index] = 1.0
            prototypes.append(vector)
            prototype_class_indices.append(class_index)
    return {
        "backbone": DINO_BACKBONE,
        "feature_dim": DINO_FEATURE_DIM,
        "classes": list(classes),
        "feature_center": feature_center,
        "head_type": "multi_prototype",
        "selection_k": selection_k,
        "adaptive_k": False,
        "prototypes": torch.stack(prototypes),
        "prototype_class_indices": torch.tensor(
            prototype_class_indices,
            dtype=torch.int64,
        ),
        "prototypes_per_class": [selection_k] * len(classes),
        "threshold": float(threshold),
        "rejection": {
            "mode": DINO_REJECTION_MODE,
            "cosine_threshold": float(threshold),
            "adjusted_distance_score_threshold": -1_000_000.0,
            "margin_weight": 0.0,
        },
        "rejection_score": "cosine_AND_distance_plus_different_class_margin",
        "prototype_norm_power": 0.0,
        "encoder_weights": "dinov2-base/model.safetensors",
        "encoder_sha256": ENCODER_SHA256,
        "preprocessing": DINO_PREPROCESSING,
        "event_aggregation": DINO_EVENT_AGGREGATION,
    }
''', encoding='utf-8')

          def adapt_feedback_store_import(text: str) -> str:
              lines: list[str] = []
              inserted = False
              for line in text.splitlines():
                  prefix = 'from system.dinov2.feedback import '
                  if line.startswith(prefix) and 'HumanFeedbackStore' in line:
                      imported = [item.strip() for item in line[len(prefix):].split(',')]
                      remaining = [item for item in imported if item != 'HumanFeedbackStore']
                      if remaining:
                          lines.append(prefix + ', '.join(remaining))
                      if not inserted:
                          lines.append('from tests.dinov2_state_fixtures import HumanFeedbackStore')
                          inserted = True
                  else:
                      lines.append(line)
              return '\n'.join(lines) + '\n'

          def adapt_routing(text: str) -> str:
              text = text.replace(
                  'from system.dinov2.rejection import MultiDualRejectionConfig',
                  'from system.dinov2.checkpoint import DinoV2Rejection\n'
                  'from system.dinov2.rejection import margin_route',
              )
              pattern = re.compile(
                  r'def test_multi_dual_routes_all_four_signal_quadrants\(\) -> None:\n.*?\n\ndef test_inference_match_cannot_update_existing_registry_prototype',
                  re.S,
              )
              replacement = '''def test_margin_rejection_routes_all_four_signal_quadrants() -> None:
    rejection = DinoV2Rejection(
        mode="multi_dual_margin",
        cosine_threshold=0.8,
        adjusted_distance_score_threshold=-0.4,
        margin_weight=2.0,
    )

    assert margin_route(0.9, 0.1, rejection) == "update_prototype"
    assert margin_route(0.9, -0.9, rejection) == "candidate"
    assert margin_route(0.2, 0.1, rejection) == "candidate"
    assert margin_route(0.2, -0.9, rejection) == "new_mode_candidate"


def test_inference_match_cannot_update_existing_registry_prototype'''
              text, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit('failed to adapt DINOv2 routing test')
              return text

          migrated = []
          for name in selected:
              source = tests / name
              if not source.is_file():
                  raise SystemExit(f'missing source state test: {source}')
              target = tests / name.replace('dinov3', 'dinov2')
              if target.exists():
                  raise SystemExit(f'target already exists: {target}')
              text = source.read_text(encoding='utf-8')
              for old, new in replacements:
                  text = text.replace(old, new)
              text = text.replace(
                  'from tests.dinov2_multi_prototype_fixtures import make_multi_prototype_payload',
                  'from tests.dinov2_state_fixtures import make_multi_prototype_payload',
              )
              text = adapt_feedback_store_import(text)
              if target.name == 'test_dinov2_api.py':
                  text = text.replace('dinov2_vitb16', 'dinov2_vitb14')
                  text = text.replace(
                      '{"backend":"dinov2",',
                      '{"schema_version":2,"backend":"dinov2",',
                  )
              if target.name == 'test_dinov2_registry_routing.py':
                  text = adapt_routing(text)
              target.write_text(text, encoding='utf-8')
              migrated.append(str(target))

          for path in tests.glob('test_dinov3*.py'):
              path.unlink()
          fixture = tests / 'dinov3_multi_prototype_fixtures.py'
          if fixture.exists():
              fixture.unlink()

          shutil.rmtree('system/dinov3', ignore_errors=True)
          for path in Path('system/backend').glob('dinov3_*.py'):
              path.unlink()
          old_workflow = Path('.github/workflows/dinov3-implementation-verification.yml')
          if old_workflow.exists():
              old_workflow.unlink()

          clean_break = Path('tests/test_dinov2_clean_break.py')
          clean_break.write_text('''from pathlib import Path


def _source(path: Path) -> str:
    return path.read_text(encoding="utf-8").lower()


def test_legacy_dinov3_runtime_tree_is_retired():
    assert not Path("system/dinov3").exists()
    assert not list(Path("system/backend").glob("dinov3_*.py"))


def test_legacy_dinov3_tests_and_workflow_are_retired():
    assert not list(Path("tests").glob("test_dinov3*.py"))
    assert not Path("tests/dinov3_multi_prototype_fixtures.py").exists()
    assert not Path(".github/workflows/dinov3-implementation-verification.yml").exists()


def test_active_flutter_source_has_no_dinov3_symbols():
    for path in Path("frontend/lib").rglob("*.dart"):
        assert "dinov3" not in _source(path), path


def test_dinov2_registry_and_examples_have_no_dinov3_dependency():
    for raw in (
        "frontend/lib/src/models/dinov2_registry.dart",
        "system/dinov2/registry_examples.py",
    ):
        path = Path(raw)
        assert "dinov3" not in _source(path), path
''', encoding='utf-8')

          Path('/tmp/migrated-tests.txt').write_text('\n'.join(migrated) + '\n', encoding='utf-8')
          PY

      - name: Run migrated DINOv2 state tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t migrated < /tmp/migrated-tests.txt
          python -m pytest -q "${migrated[@]}"

      - name: Run clean-break and complete Python suite
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q system tests
          git diff --check
          python -m pytest -q

      - name: Commit tested retirement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A system tests .github/workflows
          git commit -m 'refactor: retire DINOv3 runtime after state test migration'
          git push origin HEAD:feature/dinov2-clean-break
