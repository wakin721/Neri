name: DINOv2 clean-break migration

on:
  push:
    branches:
      - feature/dinov2-clean-break
    paths:
      - .github/workflows/dinov2-clean-break-migrate.yml
      - tools/dinov2_clean_break_migrate.py

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply deterministic migration
        run: python tools/dinov2_clean_break_migrate.py

      - name: Verify mechanical migration
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python -m compileall -q system
          if grep -Rni --include='*.dart' 'dinov3' frontend/lib; then
            echo 'DINOv3 remains in active Flutter source.' >&2
            exit 1
          fi
          if grep -ni 'dinov3' system/backend/services_legacy.py system/image_processor_legacy.py; then
            echo 'DINOv3 remains in active legacy implementation hooks.' >&2
            exit 1
          fi

      - name: Commit migration result
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No migration changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend system
          git commit -m 'refactor: complete DINOv2 active-source migration'
          git push origin HEAD:feature/dinov2-clean-break
