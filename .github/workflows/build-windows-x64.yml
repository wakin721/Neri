name: Build Windows x64

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - nightly
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: windows-x64-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  build-windows-x64:
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-within-seq.txt

      - name: Install Python backend and test dependencies
        run: |
          python -m pip install -r requirements-within-seq.txt pytest httpx numpy
          if ($LASTEXITCODE -ne 0) { throw "Backend and test dependency installation failed." }
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { throw "PyTorch installation failed." }

      - name: Run Python backend tests
        run: python -m pytest -q

      - name: Sync build version
        run: python scripts/sync_version.py

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Generate Windows project files
        working-directory: frontend
        run: ../scripts/prepare_windows.ps1

      - name: Get Flutter dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Run Flutter tests
        working-directory: frontend
        run: flutter test

      - name: Build Flutter Windows release
        working-directory: frontend
        run: flutter build windows --release

      - name: Assemble portable application
        id: artifact
        run: ./scripts/package_windows.ps1

      - name: Upload Windows x64 application
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.artifact.outputs.artifact_name }}
          path: package/${{ steps.artifact.outputs.artifact_name }}/
          # scikit-learn bundles its Windows runtime DLLs in sklearn/.libs.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      - name: Download application for distribution verification
        uses: actions/download-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.artifact_name }}
          path: downloaded-package

      - name: Verify downloaded Python dependencies
        run: |
          $python = Join-Path $env:GITHUB_WORKSPACE "downloaded-package\Neri\toolkit\python.exe"
          # Isolated mode prevents the build environment from masking missing files.
          & $python -I -c "import cv2, fastapi, lap, openpyxl, pandas, PIL, pydantic, pypinyin, uvicorn; from sklearn.cluster import HDBSCAN; from hdbscan import HDBSCAN as WithinSeqHDBSCAN"
          if ($LASTEXITCODE -ne 0) { throw "Downloaded application dependency check failed." }
