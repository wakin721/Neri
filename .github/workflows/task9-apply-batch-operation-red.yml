name: Apply Task 9 batch operation RED

on:
  push:
    branches:
      - feat/dinov3-multiprototype-remaining
    paths:
      - .github/workflows/task9-apply-batch-operation-red.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dinov3-multiprototype-remaining
      - name: Patch batch operation test
        run: python .github/scripts/task9_batch_operation_red.py
      - name: Commit batch operation RED
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/test/dinov3_box_feedback_ui_test.dart
          git diff --cached --quiet && exit 0
          git commit -m "test: define DINOv3 batch validation operation id"
          git push
