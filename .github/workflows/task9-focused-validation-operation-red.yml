name: Verify Task 9 file validation operation GREEN

on:
  push:
    branches:
      - feat/dinov3-multiprototype-remaining
    paths:
      - .github/workflows/task9-focused-validation-operation-red.yml

jobs:
  flutter-validation-operation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dinov3-multiprototype-remaining
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - working-directory: frontend
        run: flutter pub get
      - working-directory: frontend
        run: flutter test test/dinov3_box_feedback_ui_test.dart --plain-name "file validation forwards one generated feedback operation id"
