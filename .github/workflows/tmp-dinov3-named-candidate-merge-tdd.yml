name: Temporary DINOv3 named candidate merge TDD

on:
  push:
    branches:
      - feat/dinov3-startup-registry-ui

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q numpy pytest fastapi pydantic opencv-python-headless
      - name: Apply production patch
        run: python tools/apply_dinov3_named_candidate_merge.py
      - name: Compile modified sources
        run: python -m compileall -q system tests/test_dinov3_registry_named_candidate_migration.py
      - name: Run migration regression
        run: python -m pytest -q tests/test_dinov3_registry_named_candidate_migration.py
      - name: Check diff
        run: git diff --check
      - name: Commit production changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add system/dinov3/registry.py system/dinov3/feedback.py system/backend/dinov3_feedback_service.py
          if git diff --cached --quiet; then
            echo "No production changes to commit."
          else
            git commit -m "feat: merge legacy same-name DINOv3 candidates"
            git push
          fi
