name: Temporary DINOv3 named candidate merge TDD

on:
  push:
    branches:
      - feat/dinov3-startup-registry-ui

permissions:
  contents: write

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest httpx numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Apply compatibility patch
        run: python tools/apply_dinov3_named_candidate_merge_compat.py
      - name: Compile
        run: python -m compileall -q system tests
      - name: Run migration and compatibility regressions
        run: python -m pytest -q tests/test_dinov3_registry_named_candidate_migration.py tests/test_dinov3_registry_catalog_explain.py
      - name: Run all DINOv3 Python tests
        shell: bash
        run: |
          mapfile -t tests < <(find tests -maxdepth 1 -type f -name 'test_*dinov3*.py' -print | sort)
          python -m pytest -q "${tests[@]}"
      - name: Check diff
        run: git diff --check
      - name: Commit production compatibility fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add system/dinov3/feedback.py system/backend/dinov3_feedback_service.py
          if git diff --cached --quiet; then
            echo "No production changes to commit."
          else
            git commit -m "fix: preserve DINOv3 Registry assignment API shape"
            git push
          fi
