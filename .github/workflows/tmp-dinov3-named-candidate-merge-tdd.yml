name: Temporary DINOv3 named candidate merge final verification

on:
  push:
    branches:
      - feat/dinov3-startup-registry-ui

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest httpx numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile DINOv3 sources and tests
        run: python -m compileall -q system tests
      - name: Run all DINOv3 Python tests
        shell: bash
        run: |
          mapfile -t tests < <(find tests -maxdepth 1 -type f -name 'test_*dinov3*.py' -print | sort)
          python -m pytest -q "${tests[@]}"
      - name: Check repository diff
        run: git diff --check

  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: frontend
        run: flutter pub get
      - name: Analyze frontend
        working-directory: frontend
        run: flutter analyze
      - name: Run full Flutter tests
        working-directory: frontend
        run: flutter test
