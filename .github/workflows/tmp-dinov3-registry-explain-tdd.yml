name: Temporary DINOv3 registry explain TDD

on:
  push:
    branches:
      - feat/dinov3-startup-registry-ui

jobs:
  backend-red:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest httpx numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run registry catalog and explain RED tests
        run: python -m pytest -q tests/test_dinov3_registry_catalog_explain.py
