name: Temporary DINOv3 registry explain TDD

on:
  push:
    branches:
      - feat/dinov3-startup-registry-ui

permissions:
  contents: write

concurrency:
  group: tmp-dinov3-registry-explain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-green:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Apply backend implementation
        shell: bash
        run: |
          sed -i 's/new_confirmed, count=2/new_confirmed, count=1/' tools/apply_dinov3_registry_explain_backend.py
          sed -i 's/old_call, new_call, count=2/old_call, new_call, count=1/' tools/apply_dinov3_registry_explain_backend.py
          python tools/apply_dinov3_registry_explain_backend.py
          python - <<'PY'
          from pathlib import Path

          path = Path('system/backend/services.py')
          text = path.read_text(encoding='utf-8')
          old = '''def _checkpoint_species_for_model(classification_model_path: str) -> set[str]:
              from .dinov3_registry_service import load_checkpoint_for_model

              return set(load_checkpoint_for_model(classification_model_path).classes)
          '''
          new = '''def _checkpoint_species_for_model(classification_model_path: str) -> set[str] | None:
              from .dinov3_registry_service import load_checkpoint_for_model
              from system.dinov3.runtime import DinoV3ManifestError

              try:
                  return set(load_checkpoint_for_model(classification_model_path).classes)
              except (DinoV3ManifestError, FileNotFoundError):
                  # Preserve the historical feedback path when the model cannot be
                  # resolved (including mocked test paths). That path will surface
                  # the original model error rather than misclassifying it as a
                  # new-species Registry assignment.
                  return None
          '''
          if old not in text:
              raise RuntimeError('checkpoint species helper anchor missing')
          text = text.replace(old, new, 1)
          old_condition = '''                    and confirmed_species not in checkpoint_species
          '''
          new_condition = '''                    and checkpoint_species is not None
                      and confirmed_species not in checkpoint_species
          '''
          if old_condition not in text:
              raise RuntimeError('registry routing condition anchor missing')
          text = text.replace(old_condition, new_condition, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest httpx numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile changed Python sources
        run: python -m compileall -q system tests/test_dinov3_registry_catalog_explain.py
      - name: Run registry catalog and explain tests
        run: python -m pytest -q tests/test_dinov3_registry_catalog_explain.py
      - name: Run DINOv3 regression tests
        shell: bash
        run: |
          mapfile -t tests < <(find tests -maxdepth 1 -type f -name 'test_*dinov3*.py' -print | sort)
          python -m pytest -q "${tests[@]}"
      - name: Commit verified backend implementation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            system/backend/dinov3_feedback_api.py \
            system/backend/dinov3_feedback_service.py \
            system/backend/dinov3_registry_service.py \
            system/backend/services.py \
            system/dinov3/api.py \
            system/dinov3/classifier.py \
            system/dinov3/feedback.py \
            system/dinov3/registry.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: add DINOv3 registry catalog and feature explanation backend"
          git push origin HEAD:feat/dinov3-startup-registry-ui
