name: Temporary DINOv3 registry explain TDD

on:
  push:
    branches:
      - feat/dinov3-startup-registry-ui
    paths:
      - 'frontend/**'

concurrency:
  group: tmp-dinov3-registry-explain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-red:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        working-directory: frontend
        run: flutter pub get
      - name: Run feature scatter RED tests
        working-directory: frontend
        run: flutter test test/dinov3_feature_scatter_test.dart
