name: Temporary DINOv3 registry explain final verification

on:
  push:
    branches:
      - feat/dinov3-startup-registry-ui
    paths:
      - '.github/workflows/tmp-dinov3-registry-explain-tdd.yml'

permissions:
  contents: write

concurrency:
  group: tmp-dinov3-registry-explain-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Normalize touched backend formatting
        run: sed -i 's/^            and confirmed_species not in checkpoint_species$/                    and confirmed_species not in checkpoint_species/' system/backend/services.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest httpx numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile DINOv3 Python sources
        run: python -m compileall -q system tests/test_dinov3_registry_catalog_explain.py
      - name: Run DINOv3 Python regression tests
        shell: bash
        run: |
          mapfile -t tests < <(find tests -maxdepth 1 -type f -name 'test_*dinov3*.py' -print | sort)
          python -m pytest -q "${tests[@]}"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        working-directory: frontend
        run: flutter pub get
      - name: Run feature scatter tests
        working-directory: frontend
        run: flutter test test/dinov3_feature_scatter_test.dart
      - name: Run existing DINOv3 frontend tests
        working-directory: frontend
        run: flutter test test/dinov3_startup_registry_features_test.dart
      - name: Analyze Flutter frontend
        working-directory: frontend
        run: flutter analyze
      - name: Run full Flutter tests
        working-directory: frontend
        run: flutter test
      - name: Commit final formatting and remove temporary tooling
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add system/backend/services.py
          git rm -f --ignore-unmatch \
            .github/workflows/tmp-dinov3-registry-explain-tdd.yml \
            tools/apply_dinov3_registry_explain_backend.py \
            tools/apply_dinov3_registry_explain_frontend.py \
            tools/patch_dinov3_frontend_catalog_compat.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: finalize DINOv3 registry explanation"
          git push origin HEAD:feat/dinov3-startup-registry-ui
