name: DINOv2 final UI migration

on:
  push:
    branches:
      - feature/dinov2-clean-break
    paths:
      - .github/workflows/dinov2-final-ui-migrate.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply exact DINOv2 replacements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          settings = Path('frontend/lib/src/screens/settings_screen.dart')
          text = settings.read_text(encoding='utf-8')
          old = """            title: 'DINOv2 ViT-B/16',
            subtitle: _loadingDinoV2Status
                ? '正在读取 DINOv2 组件状态...'
                : _dinoV2Status == null
                ? '无法读取 DINOv2 组件状态。'
                : _dinoV2Status!.healthy && _dinoV2Status!.selectionK != null
                ? '${_dinoV2Status!.message} · Multi-prototype K=${_dinoV2Status!.selectionK}'
                : _dinoV2Status!.message,
          """
          new = """            title: 'DINOv2 ViT-B/14',
            subtitle: _loadingDinoV2Status
                ? '正在读取 DINOv2 组件状态...'
                : _dinoV2Status == null
                ? '无法读取 DINOv2 组件状态。'
                : _dinoV2Status!.healthy && _dinoV2Status!.prototypeCount != null
                ? '${_dinoV2Status!.message} · ${_dinoV2Status!.prototypeCount} prototypes'
                : _dinoV2Status!.message,
          """
          if old not in text:
              raise SystemExit('settings DINOv2 status block not found')
          settings.write_text(text.replace(old, new, 1), encoding='utf-8')

          for name, line in (
              ('frontend/lib/src/widgets/dinov2_feature_scatter.dart', "import '../models/dinov2_explanation.dart';\n"),
              ('frontend/lib/src/widgets/dinov2_registry_dialog.dart', "import '../models/dinov2_registry.dart';\n"),
          ):
              path = Path(name)
              source = path.read_text(encoding='utf-8')
              if line not in source:
                  raise SystemExit(f'unnecessary import not found in {name}')
              path.write_text(source.replace(line, '', 1), encoding='utf-8')

          legacy = Path('system/backend/main_core_legacy.py')
          source = legacy.read_text(encoding='utf-8')
          source = source.replace(
              'from system.dinov3.api import dinov3_registry_router',
              'from system.dinov2.api import dinov2_registry_router',
              1,
          ).replace(
              'app.include_router(dinov3_registry_router())',
              'app.include_router(dinov2_registry_router())',
              1,
          )
          legacy.write_text(source, encoding='utf-8')

          Path('system/backend/main_core.py').write_text(
              '"""FastAPI main app after the DINOv2 clean break."""\n'
              'from .main_core_legacy import *  # noqa: F401,F403\n'
              'from .main_core_legacy import app  # noqa: F401\n',
              encoding='utf-8',
          )
          PY

      - name: Verify Flutter
        working-directory: frontend
        run: |
          flutter pub get
          flutter analyze

      - name: Verify Python and active API naming
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q system
          git diff --check
          if grep -ni 'dinov3' system/backend/main_core.py system/backend/main_core_legacy.py; then
            echo 'DINOv3 remains in active FastAPI main app.' >&2
            exit 1
          fi

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/lib/src/screens/settings_screen.dart \
                  frontend/lib/src/widgets/dinov2_feature_scatter.dart \
                  frontend/lib/src/widgets/dinov2_registry_dialog.dart \
                  system/backend/main_core.py system/backend/main_core_legacy.py
          git commit -m 'refactor: finish DINOv2 UI and app routing migration'
          git push origin HEAD:feature/dinov2-clean-break
