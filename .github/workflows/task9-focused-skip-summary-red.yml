name: Verify Task 9 learning skip summary GREEN

# pure-summary-rule GREEN
on:
  push:
    branches:
      - feat/dinov3-multiprototype-remaining
    paths:
      - .github/workflows/task9-focused-skip-summary-red.yml

jobs:
  flutter-skip-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dinov3-multiprototype-remaining
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - working-directory: frontend
        run: flutter pub get
      - working-directory: frontend
        run: flutter test test/dinov3_feedback_skip_summary_test.dart --reporter expanded
