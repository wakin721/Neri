name: Alpha3 Changelog Link Patch

on:
  push:
    branches:
      - codex/model-sync

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/model-sync
          fetch-depth: 0

      - name: Patch changelog links
        run: python scripts/alpha3_changelog_link_patch.py

      - name: Commit patch if needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md frontend/lib/src/screens/settings_screen.dart
          git commit -m "docs: point update links to alpha3 changelog"
          git push origin HEAD:codex/model-sync
