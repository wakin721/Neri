name: Apply Task 9 feedback timer test cleanup

on:
  push:
    branches:
      - feat/dinov3-multiprototype-remaining
    paths:
      - .github/workflows/task9-apply-feedback-test-timer.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dinov3-multiprototype-remaining
      - name: Patch feedback timer test
        run: python .github/scripts/task9_feedback_test_timer.py
      - name: Commit feedback timer test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/test/dinov3_box_feedback_ui_test.dart
          git diff --cached --quiet && exit 0
          git commit -m "test: settle DINOv3 feedback snackbar timer"
          git push
