name: One-shot model sync final cleanup

on:
  push:
    branches:
      - codex/model-sync
    paths:
      - .github/workflows/model-sync-final-cleanup.yml
      - scripts/apply_model_sync_final_cleanup.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: codex/model-sync
          fetch-depth: 0

      - name: Apply anchored cleanup patch
        run: python scripts/apply_model_sync_final_cleanup.py

      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            echo "No cleanup changes produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add system/backend/main_core.py system/backend/services.py frontend/test/model_selection_test.dart frontend/test/model_sync_test.dart README.md .github/workflows/model-sync-final-verify.yml
          git commit -m "fix: finish canonical model integration"
          git push origin HEAD:codex/model-sync
