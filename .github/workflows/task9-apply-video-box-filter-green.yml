name: Apply Task 9 video-box filter GREEN

on:
  push:
    branches:
      - feat/dinov3-multiprototype-remaining
    paths:
      - .github/workflows/task9-apply-video-box-filter-green.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dinov3-multiprototype-remaining
      - name: Patch current-frame video box filtering
        run: python .github/scripts/task9_video_box_filter_green.py
      - name: Commit current-frame video box filtering
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/lib/src/widgets/detection_media_viewer.dart
          git diff --cached --quiet && exit 0
          git commit -m "refactor: share current-frame DINOv3 video box filtering"
          git push
